name: NoSlop
options:
  bundleIdPrefix: com.szwedk
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 5DDNFER638
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  NoSlop-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iOS
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: NoSlop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szwedk.noslop
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: NoSlop-Extension-iOS
        embed: true
  NoSlop-Extension-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/Shared
      - path: Extension/Resources
        buildPhase: resources
        excludes: ["images", "_locales"]
      - path: Extension/Resources/images
        type: folder
        buildPhase: resources
    info:
      path: Extension/iOS/Info.plist
      properties:
        CFBundleDisplayName: NoSlop Extension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szwedk.noslop.Extension
        APPLICATION_EXTENSION_API_ONLY: YES
  NoSlop-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
    entitlements:
      path: App/macOS/NoSlop.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: NoSlop
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szwedk.noslop
        ENABLE_APP_SANDBOX: YES
    dependencies:
      - target: NoSlop-Extension-macOS
        embed: true
  NoSlop-Extension-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/Shared
      - path: Extension/Resources
        buildPhase: resources
        excludes: ["images", "_locales"]
      - path: Extension/Resources/images
        type: folder
        buildPhase: resources
    entitlements:
      path: Extension/macOS/NoSlop-Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Extension/macOS/Info.plist
      properties:
        CFBundleDisplayName: NoSlop Extension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szwedk.noslop.Extension
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
schemes:
  NoSlop-iOS:
    build: { targets: { NoSlop-iOS: all } }
    run: { config: Debug }
  NoSlop-macOS:
    build: { targets: { NoSlop-macOS: all } }
    run: { config: Debug }
